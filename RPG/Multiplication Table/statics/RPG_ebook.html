  <h2>La table de 2</h2>

  <p lang="fr">
    La table de 2 est souvent la première que les enfants apprennent, car elle
    repose sur un principe très simple : <strong>doubler</strong> un nombre.
    Compter de 2 en 2 (2, 4, 6, 8...) correspond exactement à la suite des
    <b>nombres pairs</b>, ce qui en fait la table la plus intuitive à mémoriser.
    Les tables de multiplication telles que nous les connaissons trouvent
    leurs racines dans les civilisations babylonienne et égyptienne
    antiques, où les scribes utilisaient déjà des tables numériques
    gravées sur des tablettes d'argile pour faciliter les calculs
    commerciaux et administratifs. Le principe du doublement, à la base
    de la table de 2, était d'ailleurs une technique de calcul à part
    entière chez les Égyptiens, qui multipliaient de grands nombres en
    additionnant des doublements successifs.
  </p>
  <h2>The 2 Times Table</h2>
  <p lang="en">
    The 2 times table is often the first one children learn, since it
    relies on a very simple idea: <strong>doubling</strong> a number.
    Counting by twos (2, 4, 6, 8...) matches exactly the sequence of <b>even
    numbers</b>, making it the most intuitive table to memorize. Multiplication
    tables as we know them trace back to ancient Babylonian and Egyptian
    civilizations, where scribes already used numerical tables carved
    into clay tablets to ease trade and administrative calculations.
    Doubling, the very principle behind the 2 times table, was in fact a
    full calculation method used by the Egyptians, who multiplied large
    numbers by adding up successive doublings.
  </p>


</div>

<div style="text-align:justify;font-size:1.2em;line-height:1.3em">
  <h2>La table de 3</h2>

  <p lang="fr">
    La table de 3 marque souvent un cap dans l'apprentissage : elle demande
    un vrai effort de mémorisation, contrairement à la table de 2 qui suit
    une logique de doublement évidente. On y retrouve toutefois une astuce
    bien connue pour vérifier si un nombre est divisible par 3 : il suffit
    d'additionner ses chiffres, et si le résultat est un multiple de 3
    (3, 6, 9...), alors le nombre l'est aussi. Cette propriété fascinait déjà
    les mathématiciens de la Grèce antique, notamment les pythagoriciens,
    pour qui le nombre 3 possédait une valeur symbolique forte, représentant
    l'harmonie et l'équilibre (le triangle, figure la plus simple avec trois
    côtés, en est un exemple direct). Dans de nombreuses cultures, le chiffre
    3 est également associé à des structures narratives ou religieuses
    (le début, le milieu, la fin ; les trinités), ce qui en a fait un nombre
    particulièrement chargé de sens bien au-delà des mathématiques.
  </p>
  <h2>The 3 Times Table</h2>
  <p lang="en">
    The 3 times table often marks a turning point in learning: it requires
    real memorization effort, unlike the 2 times table, which follows an
    obvious doubling pattern. It does come with a well-known trick for
    checking divisibility by 3: simply add up a number's digits, and if the
    result is a multiple of 3 (3, 6, 9...), then the number itself is
    divisible by 3 as well. This property already fascinated mathematicians
    in ancient Greece, particularly the Pythagoreans, for whom the number 3
    held strong symbolic value, representing harmony and balance (the
    triangle, the simplest shape with three sides, is a direct example).
    In many cultures, the number 3 is also tied to storytelling or religious
    structures (beginning, middle, end; trinities), making it a number
    loaded with meaning well beyond mathematics.
  </p>

  <h2>La table de 4</h2>
  <p lang="fr">
    La table de 4 possède une particularité intéressante : elle correspond
    exactement au double de la table de 2. Ainsi, pour retrouver rapidement
    un résultat, il suffit de doubler deux fois le nombre de départ (par
    exemple, 4 x 3 = 3 doublé, puis doublé à nouveau, soit 6 puis 12). Cette
    logique de doublements successifs en fait une table plus accessible
    qu'il n'y paraît, à condition de bien maîtriser la table de 2 au
    préalable. Sur le plan historique, le nombre 4 occupe une place à part
    dans de nombreuses civilisations anciennes : les Égyptiens l'associaient
    aux quatre points cardinaux, tandis que les Grecs le reliaient aux
    quatre éléments fondamentaux (terre, eau, air, feu). Cette symbolique du
    carré et de la stabilité, portée par le chiffre 4, se retrouve jusque
    dans l'architecture et les structures géométriques les plus anciennes.
  </p>
  <h2>The 4 Times Table</h2>
  <p lang="en">
    The 4 times table has an interesting feature: it is exactly double the
    2 times table. This means that to quickly find a result, one simply has
    to double the starting number twice (for example, 4 x 3 = 3 doubled,
    then doubled again, giving 6 then 12). This pattern of successive
    doublings makes it more approachable than it might seem, as long as the
    2 times table is already well mastered. Historically, the number 4 held
    a special place in many ancient civilizations: the Egyptians linked it
    to the four cardinal directions, while the Greeks connected it to the
    four classical elements (earth, water, air, fire). This symbolism of
    the square and of stability, carried by the number 4, can still be
    seen today in architecture and in some of the oldest geometric
    structures.
  </p>
</div>

  <h2>La table de 5</h2>
  <p lang="fr">
    La table de 5 est réputée pour sa grande facilité d'apprentissage : tous
    ses résultats se terminent soit par 0, soit par 5, ce qui permet de les
    reconnaître instantanément et de vérifier ses calculs d'un simple coup
    d'œil. Cette régularité s'explique par le lien étroit entre le chiffre 5
    et notre système décimal, puisque 5 est exactement la moitié de 10. Le
    choix même de la base 10 pour compter n'est d'ailleurs pas un hasard :
    il trouve son origine dans le nombre de doigts des deux mains, et le
    chiffre 5 correspondait naturellement au nombre de doigts d'une seule
    main chez de nombreuses civilisations antiques. On retrouve cette trace
    dans le mot latin "quincunx" ou dans les systèmes de numération
    romains, où le chiffre V symbolisait précisément une main ouverte.
  </p>
  <h2>The 5 Times Table</h2>
  <p lang="en">
    The 5 times table is well known for being especially easy to learn:
    every result ends in either 0 or 5, which makes them instantly
    recognizable and easy to check at a glance. This regularity comes from
    the close relationship between the number 5 and our decimal system,
    since 5 is exactly half of 10. The very choice of base 10 for counting
    is no coincidence either: it originates from the number of fingers on
    both hands, and the number 5 naturally corresponded to the fingers of
    a single hand in many ancient civilizations. Traces of this can still
    be found in Roman numerals, where the symbol V represented precisely
    an open hand.
  </p>
</div>

  <h2>La table de 6</h2>
  <p lang="fr">
    La table de 6 marque le passage vers des tables considérées comme plus
    difficiles à mémoriser, car elle ne bénéficie plus d'astuce aussi simple
    que le doublement ou la terminaison régulière. Elle offre cependant une
    particularité amusante : lorsqu'on multiplie 6 par un nombre pair, le
    résultat se termine toujours par le même chiffre que ce nombre (6 x 2 =
    12, 6 x 4 = 24, 6 x 8 = 48). Sur le plan historique, le nombre 6 occupe
    une place particulière depuis l'Antiquité : les mathématiciens grecs le
    considéraient comme un "nombre parfait", c'est-à-dire un nombre égal à
    la somme de ses diviseurs (1 + 2 + 3 = 6). Les Babyloniens, quant à eux,
    utilisaient un système de numération en base 60 (un multiple de 6), ce
    qui explique encore aujourd'hui pourquoi une heure compte 60 minutes et
    un cercle 360 degrés.
  </p>
  <h2>The 6 Times Table</h2>
  <p lang="en">
    The 6 times table marks a shift toward tables generally seen as harder
    to memorize, since it no longer benefits from a simple trick like
    doubling or a regular last digit. It does offer one fun feature though:
    when 6 is multiplied by an even number, the result always ends in the
    same digit as that number (6 x 2 = 12, 6 x 4 = 24, 6 x 8 = 48).
    Historically, the number 6 has held a special place since antiquity:
    Greek mathematicians regarded it as a "perfect number," meaning a
    number equal to the sum of its divisors (1 + 2 + 3 = 6). The
    Babylonians, for their part, used a base-60 numeral system (a multiple
    of 6), which is still the reason today why an hour has 60 minutes and
    a circle has 360 degrees.
  </p>
</div>

    La table de 7 est souvent considérée comme la plus difficile à

    aucune régularité évidente dans la terminaison de ses résultats, et

    widespread presence of the number 7 in human reference points partly

  <p lang="fr">
    La table de 8 peut sembler intimidante au premier abord, mais elle
    cache en réalité une logique simple : il suffit de doubler trois fois
    de suite le nombre de départ, puisque 8 est égal à 2 x 2 x 2 (par

  </p>
  <h2>The 8 Times Table</h2>
  <p lang="en">
    The 8 times table might seem intimidating at first, but it actually
    hides a simple logic: one just needs to double the starting number
    three times in a row, since 8 equals 2 x 2 x 2 (for example, 8 x 3 = 3
    doubled three times, giving 6, then 12, then 24). This property, much
    like with the 4 times table, makes it more approachable than it looks
    for anyone comfortable with doubling. The number 8 also carries strong
    symbolic weight throughout history: in many Asian cultures, especially
    in China, it is considered a lucky number associated with prosperity,
    due to its pronunciation being close to the word for "wealth."
    Geometrically, the number 8 also evokes the octagon, a shape found in
    many historic buildings as a symbol of transition between the square
    and the circle.

  <h2>The 9 Times Table</h2>
  <p lang="en">
    The 9 times table is famous for its many calculation tricks, making it
    one of the most fascinating to explore. The best known relies on the
    fingers: by folding down the finger corresponding to the number being
    multiplied, the fingers remaining on either side directly give the two

    table. The number 9, the last digit before moving to the next ten, has
    long been associated with the idea of completion and a full cycle in
    many ancient numerical traditions.
  </p>

<template id="page-20">
<div style="text-align:justify;font-size:1.2em;line-height:1.3em">
  <h2>La table de 10</h2>
  <p lang="fr">
    La table de 10 est sans doute la plus simple de toutes : il suffit
    d'ajouter un zéro au nombre multiplié pour obtenir instantanément le
    résultat. Cette simplicité n'est pas un hasard, elle découle directement
    de notre système de numération décimal, construit précisément autour de
    la base 10. Ce choix du 10 comme fondement de notre façon de compter
    remonte à l'usage naturel des dix doigts des mains, une méthode de
    calcul universelle adoptée par de très nombreuses civilisations à
    travers l'histoire. Le nombre 10 a également une forte portée
    symbolique : chez les pythagoriciens, il représentait la perfection
    absolue, en tant que somme des quatre premiers nombres (1 + 2 + 3 + 4 =
    10), une figure qu'ils appelaient la "tétraktys" et considéraient comme
    sacrée. Apprendre la table de 10 marque ainsi souvent, pour les élèves,
    la confirmation intuitive de la logique même de notre système de
    numération.
  </p>
  <h2>The 10 Times Table</h2>
  <p lang="en">
    The 10 times table is arguably the simplest of them all: simply adding
    a zero to the multiplied number instantly gives the result. This
    simplicity is no accident, it comes directly from our decimal numeral
    system, built precisely around base 10. This choice of 10 as the
    foundation of how we count traces back to the natural use of the ten
    fingers on our hands, a universal calculation method adopted by
    countless civilizations throughout history. The number 10 also carries
    strong symbolic weight: for the Pythagoreans, it represented absolute
    perfection, as the sum of the first four numbers (1 + 2 + 3 + 4 = 10),
    a figure they called the "tetraktys" and considered sacred. Learning
    the 10 times table therefore often serves, for students, as an
    intuitive confirmation of the very logic behind our numeral system.
  </p>
</div>

  <h2>La table de 11</h2>
  <p lang="fr">
    La table de 11 surprend souvent par sa facilité, du moins pour ses
    premiers résultats : de 11 x 1 à 11 x 9, il suffit de répéter deux fois
    le chiffre multiplié pour obtenir directement le résultat (11 x 3 = 33,
    11 x 7 = 77). Cette régularité s'explique simplement par le fait que 11
    est égal à 10 + 1, ce qui revient à additionner le nombre à lui-même
    décalé d'un rang. Au-delà de 11 x 9, une autre astuce existe : pour
    multiplier 11 par un nombre à deux chiffres, il suffit d'additionner
    ces deux chiffres et de glisser le résultat entre eux (11 x 23 : 2 + 3 =
    5, donc 253). Sur le plan historique, le nombre 11 n'a pas la charge
    symbolique de ses voisins 10 ou 12, mais il occupe une place
    particulière dans certains sports et traditions, notamment au football
    où chaque équipe aligne onze joueurs sur le terrain.
  </p>
  <h2>The 11 Times Table</h2>
  <p lang="en">
    The 11 times table is often surprisingly easy, at least for its first
    results: from 11 x 1 to 11 x 9, simply repeating the multiplied digit
    twice gives the result directly (11 x 3 = 33, 11 x 7 = 77). This
    regularity comes from the fact that 11 equals 10 + 1, which amounts to
    adding the number to itself shifted by one place. Beyond 11 x 9,
    another trick applies: to multiply 11 by a two-digit number, simply add
    those two digits together and slot the result between them (11 x 23:
    2 + 3 = 5, so 253). Historically, the number 11 does not carry the
    same symbolic weight as its neighbors 10 or 12, but it holds a
    notable place in certain sports and traditions, most famously in
    football, where each team fields eleven players on the pitch.
  </p>

  <h2>La table de 12</h2>
  <p lang="fr">
    La table de 12 clôture traditionnellement l'apprentissage des tables de
    multiplication, et elle possède une richesse historique particulière.
    Contrairement au 10, le nombre 12 n'est pas lié à notre système
    décimal, mais à un système duodécimal (en base 12), qui a longtemps
    coexisté avec celui en base 10 dans de nombreuses civilisations. Cette
    influence est encore bien visible aujourd'hui : une année compte 12
    mois, une journée se divise en deux fois 12 heures, et de nombreuses
    unités de mesure ancestrales utilisaient le 12 comme référence, comme
    la douzaine, encore employée couramment pour compter les œufs. Cette
    popularité du 12 s'explique en partie par sa grande divisibilité : il
    peut être divisé exactement par 1, 2, 3, 4 et 6, ce qui en faisait un
    nombre particulièrement pratique pour les échanges commerciaux et le
    partage de quantités dans les sociétés anciennes.
  </p>
  <h2>The 12 Times Table</h2>
  <p lang="en">
    The 12 times table traditionally closes out the learning of
    multiplication tables, and it carries a particularly rich history.
    Unlike 10, the number 12 is not tied to our decimal system but to a
    duodecimal system (base 12), which coexisted for a long time alongside
    the base-10 system in many civilizations. This influence is still
    clearly visible today: a year has 12 months, a day is split into two
    sets of 12 hours, and many ancestral units of measurement used 12 as a
    reference, such as the dozen, still commonly used to count eggs. This
    popularity of 12 partly comes from its high divisibility: it can be
    evenly divided by 1, 2, 3, 4, and 6, which made it a particularly
    practical number for trade and for sharing quantities in ancient
    societies.
  </p>

<script>
let tempo = 300;
// On détecte toutes les pages via les templates (id commençant par "page-")
const allTemplates = Array.from(document.querySelectorAll('template[id^="page-"]'));
//===========================================================
// Trier les templates par index numérique (extrait de l'id)
//===========================================================
allTemplates.sort((a, b) => {
  const aNum = parseInt(a.id.replace('page-', ''), 10);
  const bNum = parseInt(b.id.replace('page-', ''), 10);
  return aNum - bNum;
});
//===========================================================
// Crée un tableau des indexes disponibles
//===========================================================
const pagesIndexes = allTemplates.map(tpl => parseInt(tpl.id.replace('page-', ''), 10));
// Pour la navigation, on utilise les indexes triés
let currentLeftIndexPos = 0;  // position dans pagesIndexes pour page de gauche
let currentRightIndexPos = 1; // position dans pagesIndexes pour page de droite
const book = document.querySelector('.book-container');
let leftPage = null;
let rightPage = null;
//===========================================================
// Crée une page à partir d'un template cloné
//===========================================================
function createPage(pagePosInArray, side) {
  const tpl = allTemplates[pagePosInArray];
  const div = document.createElement('div');
  div.classList.add('page', side);
  // Si le template est celui de la page vide (-1), on ajoute classe transparent
  if (pagesIndexes[pagePosInArray] === -1) div.classList.add('transparent');
  div.setAttribute('aria-hidden', 'false');
  div.appendChild(tpl.content.cloneNode(true));
  // Interception des liens pour navigation fluide
  div.querySelectorAll('a[data-page]').forEach(link => {
    link.style.color = "#A52A2A";
    link.addEventListener('click', function (e) {
      const targetPage = parseInt(link.getAttribute('data-page'), 10);
      if (pagesIndexes.includes(targetPage)) {
        e.preventDefault();
        gotoPage(targetPage);
      }
    });
  });
  return div;
}
//===========================================================
//Efface la page
//===========================================================
function clearFlipClasses() {
  if (leftPage) leftPage.classList.remove('flip-left');
  if (rightPage) rightPage.classList.remove('flip-right');
  if (leftPage) leftPage.style.zIndex = '';
  if (rightPage) rightPage.style.zIndex = '';
}
//===========================================================
// Affiche la page
//===========================================================
function render() {
  clearFlipClasses();
  if (leftPage) leftPage.remove();
  if (rightPage) rightPage.remove();
  // Clamp bornes
  if (currentLeftIndexPos < 0) currentLeftIndexPos = 0;
  if (currentRightIndexPos < 1) currentRightIndexPos = 1;
  if (currentLeftIndexPos > allTemplates.length - 2) currentLeftIndexPos = allTemplates.length - 2;
  if (currentRightIndexPos > allTemplates.length - 1) currentRightIndexPos = allTemplates.length - 1;
  leftPage = createPage(currentLeftIndexPos, 'left');
  rightPage = createPage(currentRightIndexPos, 'right');
  book.appendChild(leftPage);
  book.appendChild(rightPage);
}
//===========================================================
//Tourne la page à droite
//===========================================================
function flipRight() {
  if (currentRightIndexPos >= allTemplates.length - 2) return;
  rightPage.classList.add('flip-right');
  rightPage.style.zIndex = 100;
  setTimeout(() => {
    currentLeftIndexPos = currentRightIndexPos + 1;
    currentRightIndexPos = currentRightIndexPos + 2;
    render();
  }, tempo);
}
//===========================================================
//Tourne la page à gauche
//===========================================================
function flipLeft() {
  if (currentLeftIndexPos <= 0) return;
  leftPage.classList.add('flip-left');
  leftPage.style.zIndex = 100;
  setTimeout(() => {
    currentRightIndexPos = currentLeftIndexPos - 1;
    currentLeftIndexPos = currentLeftIndexPos - 2;
    render();
  }, tempo);
}
//===========================================================
// Navigation "goto" vers n'importe quelle page
//===========================================================
function gotoPage(targetPageIndex) {
  let idx = pagesIndexes.indexOf(targetPageIndex);
  if (idx === -1) return;
  // Book tourne dans le bon sens selon la destination
  
if (idx % 2 === 1) { // cible = page droite
    if (currentRightIndexPos === idx) return;
    rightPage.classList.add('flip-right');
    rightPage.style.zIndex = 100;
    setTimeout(() => {
      currentLeftIndexPos = idx - 1;
      currentRightIndexPos = idx;
      render();
    }, tempo);
  } else { // gauche
    if (currentLeftIndexPos === idx) return;
    leftPage.classList.add('flip-left');
    leftPage.style.zIndex = 100;
    setTimeout(() => {
      currentLeftIndexPos = idx;
      currentRightIndexPos = idx + 1;
      render();
    }, tempo);
  }
}
  const continues = document.querySelectorAll('.continue');

  continues.forEach(el => {
    el.addEventListener('click', flipRight);
  });

document.getElementById('nav-right').addEventListener('click', flipRight);
document.getElementById('nav-left').addEventListener('click', flipLeft);
['nav-left', 'nav-right'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      document.getElementById(id).click();
    }
  });
});
//===========================================================
// Gestion des clicks
//===========================================================
 document.addEventListener('click', function handleClick(e) {
  // Ignore clicks already inside the overlay (so overlay click closes it separately)
  if (e.target.closest('.img-overlay')) return;

  // Find nearest image clicked (works if clicking inside <a><img> or <figure><img> etc.)
  const img = e.target.closest('img');
  if (!img) return;

  // OPTIONAL: ignore tiny icons (uncomment if needed)
  // if (img.naturalWidth < 80 && img.naturalHeight < 80) return;

  // Prevent link navigation if image is inside an <a>
  const link = img.closest('a');
  if (link) e.preventDefault();

  openImageOverlay(img);
});
//===========================================================
/* Create overlay once and reuse it */
//===========================================================
function createOverlay() {
  const ov = document.createElement('div');
  ov.className = 'img-overlay';
  ov.innerHTML = '<div class="img-wrap"><img alt=""></div>';
  document.body.appendChild(ov);

  // clicking overlay (outside image) closes it
  ov.addEventListener('click', (ev) => {
    // if user clicked the image itself, also close (ev.target is the img) — both behaviours ok
    closeOverlay();
  });

  // ESC closes
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeOverlay();
  });

  return ov;
}

let overlay = null;
function ensureOverlay() {
  if (!overlay) overlay = createOverlay();
  return overlay;
}

function openImageOverlay(sourceImg) {
  const ov = ensureOverlay();
  const clonedImg = ov.querySelector('img');

  // set src to currentSrc if available to handle responsive <img srcset>
  clonedImg.src = sourceImg.currentSrc || sourceImg.src;
  clonedImg.alt = sourceImg.alt || '';

  // show overlay
  ov.classList.add('open');

  // prevent background scrolling
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
}

function closeOverlay() {
  if (!overlay) return;
  overlay.classList.remove('open');

  // restore scrolling after small timeout to allow opacity transition
  setTimeout(() => {
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }, 200);
}

//===========================================================
// Affichage initial
//===========================================================
render();
</script>
