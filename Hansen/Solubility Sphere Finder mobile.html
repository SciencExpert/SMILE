let PopupTitle="Title";
let productColors = new Map(); // stocke la couleur de chaque produit
let projection = '3d';

function addSolventRow() {
  const tbody = document.querySelector("#solventTable tbody");
  const row = tbody.insertRow();
  for (let i = 0; i < 4; i++) {
    const cell = row.insertCell();
    const input = document.createElement("input");
    input.type = (i === 0) ? "text" : "number";
    input.step = "0.01";
    cell.appendChild(input);
  }
}
//------------------------------------------------------------------
function addProductRow() {
  const tbody = document.querySelector("#productTable tbody");
  const row = tbody.insertRow();
  for (let i = 0; i < 5; i++) {
    const cell = row.insertCell();
    const input = document.createElement("input");
    input.type = (i === 0) ? "text" : "number";
    input.step = "0.1";
    cell.appendChild(input);
  }
  // attribuer couleur
  const defaultName = "Produit " + (tbody.rows.length);
  row.cells[0].children[0].value = defaultName;
  productColors.set(defaultName, getRandomColor());
  updateLegend();
}

function getRandomColor() {
  return 'hsl(' + Math.floor(Math.random()*360) + ',70%,60%)';
}

//----------------------------------------
function updateLegend() {

  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  const rows = document.querySelectorAll("#productTable tbody tr");
  rows.forEach(r => {
    const name = r.cells[0].children[0].value;
    if (!name) return;
    if (!productColors.has(name)) {
      productColors.set(name, getRandomColor());
    }
    const item = document.createElement("div");
    item.className = "legend-item";
    const colorBox = document.createElement("div");
    colorBox.className = "legend-color";
    colorBox.style.background = productColors.get(name);
    const label = document.createElement("span");
    label.textContent = name;
    item.appendChild(colorBox);
    item.appendChild(label);
    legend.appendChild(item);
  });

}

function setProjection(proj) {
  projection = proj;
  renderPlot();
}


//----------------------------------------


function createSphere3D(cx, cy, cz, r, color) {
  const uSteps = 20, vSteps = 20;
  const x = [], y = [], z = [];
  for (let i = 0; i <= uSteps; i++) {
    const u = i * Math.PI / uSteps;
    for (let j = 0; j <= vSteps; j++) {
      const v = j * 2 * Math.PI / vSteps;
      x.push(cx + r * Math.sin(u) * Math.cos(v));
      y.push(cy + r * Math.sin(u) * Math.sin(v));
      z.push(cz + r * Math.cos(u));
    }
  }
  return {
    type: 'mesh3d',
    x, y, z,
    opacity: 0.2,
    color: color,
    alphahull: 0,
    name: 'Sphère'
  };
}
//----------------------------------------------------------------------
function createCircleProjection(cx, cy, r, color) {
  const points = 100;
  const theta = Array.from({length: points+1}, (_,i) => 2*Math.PI*i/points);
  return {
    x: theta.map(t => cx + r * Math.cos(t)),
    y: theta.map(t => cy + r * Math.sin(t)),
    mode: 'lines',
    line: { color: color, width: 2 },
    name: 'Projection sphère'
  };
}


//----------------------------------------------------------------------------
function getAxisLimits(solvents, products) {
  if (solvents.length === 0 && products.length === 0) {
    return {x:{min:0,max:1},y:{min:0,max:1},z:{min:0,max:1}};
  }
  let allD = solvents.map(s => s.d).concat(products.map(p => p.d));
  let allP = solvents.map(s => s.p).concat(products.map(p => p.p));
  let allH = solvents.map(s => s.h).concat(products.map(p => p.h));
  let Rmax = products.length ? Math.max(...products.map(p => p.R0)) : 0;
  return {
    x: {min: Math.min(...allD) - Rmax, max: Math.max(...allD) + Rmax},
    y: {min: Math.min(...allP) - Rmax, max: Math.max(...allP) + Rmax},
    z: {min: Math.min(...allH) - Rmax, max: Math.max(...allH) + Rmax}
  };
}


//-------------------------------------------------------------------------

function renderPlot() {

  // --- 1️⃣ Récupération et normalisation des solvants ---
  const solvents = solvants.map(s => ({
    name: s.name,
    d: s.dd ?? s.d,
    p: s.dp ?? s.p,
    h: s.dh ?? s.h
  }));

  document.querySelectorAll("#solventTable tbody tr").forEach(row => {
    const name = row.cells[0]?.children[0]?.value.trim();
    const d = parseFloat(row.cells[1]?.children[0]?.value);
    const p = parseFloat(row.cells[2]?.children[0]?.value);
    const h = parseFloat(row.cells[3]?.children[0]?.value);

    if (!name || isNaN(d) || isNaN(p) || isNaN(h)) return;

    const index = solvents.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
    if (index >= 0) {
      solvents[index] = { name, d, p, h };
    } else {
      solvents.push({ name, d, p, h });
    }
  });

  // --- 2️⃣ Récupération des produits ---
  const products = [];
  document.querySelectorAll("#productTable tbody tr").forEach(r => {
    const name = r.cells[0].children[0].value;
    const d = parseFloat(r.cells[1].children[0].value);
    const p = parseFloat(r.cells[2].children[0].value);
    const h = parseFloat(r.cells[3].children[0].value);
    const R0 = parseFloat(r.cells[4].children[0].value);
    if (!isNaN(d) && !isNaN(p) && !isNaN(h) && !isNaN(R0)) {
      if (!productColors.has(name)) {
        productColors.set(name, getRandomColor());
      }
      products.push({ name, d, p, h, R0, color: productColors.get(name) });
    }
  });

  // --- 3️⃣ Légende et limites d’axes ---
  updateLegend();
  const limits = getAxisLimits(solvents, products);

  // --- 4️⃣ Attribution des couleurs aux solvants ---
  solvents.forEach(solvent => {
    let insideCount = 0;
    let sphereColor = null;

    products.forEach(prod => {
      const dist = Math.sqrt(
        Math.pow(solvent.d - prod.d, 2) +
        Math.pow(solvent.p - prod.p, 2) +
        Math.pow(solvent.h - prod.h, 2)
      );
      if (dist <= prod.R0) {
        insideCount++;
        sphereColor = prod.color;
      }
    });

    if (insideCount === 0) {
      solvent.color = "red";
    } else if (insideCount === 1) {
      solvent.color = sphereColor;
    } else {
      solvent.color = "green";
    }
  });

  // --- 5️⃣ Détection des solvants communs ---
  let commonSolvents = [];

  if (products.length == 0) {
commonSolvents = [...solvents];
  }



  if (products.length > 0) {
    solvents.forEach(solvent => {
      const insideAll = products.every(prod => {
        const dist = Math.sqrt(
          Math.pow(solvent.d - prod.d, 2) +
          Math.pow(solvent.p - prod.p, 2) +
          Math.pow(solvent.h - prod.h, 2)
        );
        return dist <= prod.R0;
      });
      if (insideAll) {
        commonSolvents.push(solvent);
      }
    });
  }
  window.commonSolventsList = commonSolvents;

  // --- 6️⃣ Affichage ---
  if (projection === '3d') {

    const traces = [{
      x: solvents.map(s => s.d),
      y: solvents.map(s => s.p),
      z: solvents.map(s => s.h),
      text: solvents.map(s => s.name),
      mode: 'markers',
      type: 'scatter3d',
      marker: { size: 4, color: solvents.map(s => s.color) },
      name: 'Solvants'
    }];

    products.forEach(prod => {
      traces.push({
        x: [prod.d],
        y: [prod.p],
        z: [prod.h],
        mode: 'markers',
        type: 'scatter3d',
        marker: { size: 5, color: prod.color },
        name: prod.name
      });
      traces.push(createSphere3D(prod.d, prod.p, prod.h, prod.R0, prod.color));
    });

    Plotly.newPlot('plot', traces, {
      scene: {
        xaxis: { title: "δd", range: [limits.x.min, limits.x.max] },
        yaxis: { title: "δp", range: [limits.y.min, limits.y.max] },
        zaxis: { title: "δh", range: [limits.z.min, limits.z.max] }
      },
      margin: { t: 20 },
      showlegend: false
    });

  } else {
    let xLabel, yLabel;
    const traces = [{
      x: [],
      y: [],
      text: solvents.map(s => s.name),
      mode: 'markers',
      type: 'scatter',
      marker: { size: 6, color: solvents.map(s => s.color) },
      name: 'Solvants'
    }];
    if (projection === 'dddp') { xLabel = "δd"; yLabel = "δp"; }
    if (projection === 'dddh') { xLabel = "δd"; yLabel = "δh"; }
    if (projection === 'dpdh') { xLabel = "δp"; yLabel = "δh"; }

    traces[0].x = solvents.map(s => (xLabel === "δd" ? s.d : s.p));
    traces[0].y = solvents.map(s => (yLabel === "δp" ? s.p : s.h));

    products.forEach(prod => {
      let cx = (xLabel === "δd" ? prod.d : prod.p);
      let cy = (yLabel === "δp" ? prod.p : prod.h);
      traces.push({
        x: [cx],
        y: [cy],
        mode: 'markers',
        marker: { size: 6, color: prod.color },
        name: prod.name
      });
      traces.push(createCircleProjection(cx, cy, prod.R0, prod.color));
    });

    // Ajustement auto 2D
    let allX = traces.flatMap(t => t.x || []);
    let allY = traces.flatMap(t => t.y || []);
    let Rmax = products.length ? Math.max(...products.map(p => p.R0)) : 0;
    let minX = Math.min(...allX) - Rmax;
    let maxX = Math.max(...allX) + Rmax;
    let minY = Math.min(...allY) - Rmax;
    let maxY = Math.max(...allY) + Rmax;

    Plotly.newPlot('plot', traces, {
      xaxis: { title: xLabel, range: [minX, maxX] },
      yaxis: { title: yLabel, range: [minY, maxY] },
      margin: { t: 20 },
      showlegend: false
    });
  }
}































//------------------------------------------
async function getMergedSolvents(jsonUrl) {
  try {
    // 1️⃣ Copie de la base initiale
    let solvents = solvants.map(s => ({ ...s }));

    // 2️⃣ Charger la liste externe (JSON)
    if (jsonUrl) {
      try {
        const response = await fetch(jsonUrl);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        const extraSolvents = await response.json();

        if (Array.isArray(extraSolvents)) {
          extraSolvents.forEach(s => {
            const index = solvents.findIndex(
              existing => existing.name.toLowerCase() === s.name.toLowerCase()
            );
            if (index === -1) {
              solvents.push({
                name: s.name,
                dd: s.d, // conversion de clé si besoin
                dp: s.p,
                dh: s.h,
                status: s.status || "",
                cas: s.cas || "",
                risk: s.risk || "",
                comment: s.comment || ""
              });
            }
          });
        } else {
          console.warn("Le fichier JSON n'est pas un tableau :", extraSolvents);
        }
      } catch (err) {
        console.error("Erreur chargement JSON :", err);
      }
    }

    // 3️⃣ Parcours des lignes du tableau HTML pour écraser/ajouter
    document.querySelectorAll("#solventTable tbody tr").forEach(r => {
      const inputName = r.cells[0]?.children[0];
      const inputD = r.cells[1]?.children[0];
      const inputP = r.cells[2]?.children[0];
      const inputH = r.cells[3]?.children[0];

      if (!inputName || !inputD || !inputP || !inputH) return;

      const name = inputName.value.trim();
      const d = parseFloat(inputD.value);
      const p = parseFloat(inputP.value);
      const h = parseFloat(inputH.value);

      if (!name || isNaN(d) || isNaN(p) || isNaN(h)) return;

      const index = solvents.findIndex(s => s.name.toLowerCase() === name.toLowerCase());

      if (index >= 0) {
        solvents[index] = { ...solvents[index], name, dd: d, dp: p, dh: h };
      } else {
        solvents.push({ name, dd: d, dp: p, dh: h });
      }
    });

    console.log("Merged solvents:", solvents);
    return solvents;
  } catch (e) {
    console.error("Error in getMergedSolvents:", e);
    return [];
  }
}

document.getElementById("importBtn").addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const importedSolvents = JSON.parse(e.target.result);
      if (!Array.isArray(importedSolvents)) {
        alert("Le fichier doit contenir un tableau JSON de solvants.");
        return;
      }

      importedSolvents.forEach(solvent => {
        // Normaliser les clés
        const newSolvent = {
          name: solvent.name,
          dd: solvent.dd ?? solvent.d ?? 0,
          dp: solvent.dp ?? solvent.p ?? 0,
          dh: solvent.dh ?? solvent.h ?? 0
        };

        const index = solvants.findIndex(
          s => s.name.toLowerCase() === newSolvent.name.toLowerCase()
        );
        if (index >= 0) {
          solvants[index] = { ...solvants[index], ...newSolvent };
        } else {
          solvants.push(newSolvent);
        }
      });

      alert("Liste de solvants importée avec succès !");
      renderPlot(); // Mise à jour du graphe

    } catch (err) {
      console.error("Erreur d'import :", err);
      alert("Fichier JSON invalide.");
    }
  };
  reader.readAsText(file);
});

function togglePopup() {
  const popup = document.getElementById("popupList");
  if (popup.style.display === "block") {
    popup.style.display = "none";
  } else {
    popup.style.display = "block";
  }
}
//---------------------------------------export common solvant
function exportCommonSolventsCSV() {
  // Vérifier qu'il y a une liste à exporter
  if (!window.commonSolventsList || window.commonSolventsList.length === 0) return;

  // Construire les entêtes du CSV
  let csvContent = "Name,δd,δp,δh,risk,comment\n";

  // Pour chaque solvant commun, écrire une ligne
  window.commonSolventsList.forEach(solvent => {
    // Prendre le nom ET les bons champs numériques quel que soit leur nom (d, dd, etc)
    const d = solvent.d  ?? solvent.dd;
    const p = solvent.p  ?? solvent.dp;
    const h = solvent.h  ?? solvent.dh;
csvContent += `${solvent.name},${d.toFixed(2)},${p.toFixed(2)},${h.toFixed(2)},${solvent.risk ?? ""},${solvent.comment ?? ""}\n`;
  });

  // Préparer le téléchargement
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", "common_solvents.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
