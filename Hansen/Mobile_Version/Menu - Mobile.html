<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SciencExpert - Hansen Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="https://sciencexpert.github.io/SMILE/Hansen/images/SE_favicon.ico">

  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    html, body { height: 100%; font-family: Arial, sans-serif; }
    body {
      background: url('https://sciencexpert.github.io/SMILE/Hansen/images/Sphere_Image.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      text-align: center;
    }

    @media (max-width: 768px) {
  body {
    background-attachment: scroll; /* évite le bug mobile */
    background-position: center top;
  }
}


    h1 {
      margin-top: 10px;
      font-size: 3vw;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    h2 {
      margin-bottom: 30px;
      font-size: 2em;
      color: black;
      text-shadow: 2px 2px 4px white;
    }
    .button-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 15%;
      margin-bottom: 60px;
      gap: 20px;
    }
    .button-container a {
      background: linear-gradient(135deg, #ccd6dd, #7f9db9);
      color: black;
      padding: 20px 40px;
      font-size: 1.5em;
      text-decoration: none;
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
      cursor: pointer;
      width: 450px;
      text-align: center;
      margin: 0 auto;
      display: block;
    }
    .button-container a:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      background: linear-gradient(135deg, #e2e8f0, #9bb4cc);
    }

    /* Footer caché par défaut */
    #footer {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      position: fixed; bottom:0; left:0; width:100%;
      background: #f0f0f0; color: black;
      text-align: center; padding: 10px 0;
      font-size: 15px; border-top: 1px solid #ccc; z-index:1000;
    }

    /* Footer affiche au hover sur PC */
    @media (hover: hover) and (pointer: fine) {
      body:hover #footer {
        opacity: 1;
        pointer-events: auto;
      }
    }

    /* Responsive : colonne sur mobile, boutons plus grands */
    @media (max-width: 900px) {
      .button-container {
        flex-direction: column;
        padding: 0 5vw;
        margin-bottom: 30px;
      }
      .button-container a {
        width: 97vw;
        font-size: 1.3em;
        margin-bottom: 16px;
        padding: 16px 0;
      }
      h1 { font-size: 2em; }
      h2 { font-size: 1.3em; }
    }
    @media (max-width: 500px) {
      h1 { font-size: 1.5em;}
      .button-container a { font-size: 1.1em; padding: 10px 0;}
      #footer { font-size: 0.93em; padding: 8px 0;}
    }
  </style>
</head>

<body>
  <h1 style="color:white; font-size:6em; text-shadow:2px 2px 4px black;"><i>CoordiMate&trade;</i></h1>
  <div style="
    display: flex;
    justify-content: center; /* centre horizontalement */
    align-items: center;     /* centre verticalement */
    height: 100vh;           /* prend toute la hauteur de la fenêtre */
">
  <h2 style="text-align:center;font-size:3em;">Simulate<br>Experiment<br>Locate</h2>
</div>


  <div class="button-container">
    <a href="groupe contribution programm22.html">🟢 Structure/Solubility Simulator</a>
    <a href="Solubility Sphere Finder.html">🔴 Solubilty Sphere Finder</a>
    <a href="progr sphère de solutibité V24.html">🟡 Hansen Solubility Parameters</a>
  </div>

  <div id="footer">
    © 2025 SciencExpert. Website designed and developed by
    <a href="https://payhip.com/SciencExpert/sciencexpert" target="_blank" rel="noopener noreferrer" style="color:#0077cc; text-decoration:none;">SciencExpert™</a>.
    All rights reserved. Unauthorized use or reproduction is prohibited.
  </div>

  <!-- Bouton flottant (mobile/touch) -->
  <div id="footerToggleBtn" style="display:none;position:fixed;bottom:18px;right:12px;background:#555;color:white;border-radius:20px;padding:8px 12px;z-index:2001;cursor:pointer;font-size:1.3em;">
    ▲
  </div>

<script>
// Footer toggle en mobile, au tap
document.addEventListener('DOMContentLoaded', function() {
  const footer = document.getElementById('footer');
  const toggleBtn = document.getElementById('footerToggleBtn');
  const isTouch = window.matchMedia('(hover: none)').matches || ('ontouchstart' in window);

  // Si tactile, bouton flottant
  if (isTouch) {
    toggleBtn.style.display = 'block';
    let visible = false;
    toggleBtn.addEventListener('click', () => {
      visible = !visible;
      footer.style.opacity = visible ? '1' : '0';
      footer.style.pointerEvents = visible ? 'auto' : 'none';
      toggleBtn.textContent = visible ? '▼' : '▲';
    });
    // Masque le footer si on clique ailleurs
    document.body.addEventListener('click', function(e){
      if (visible && e.target !== toggleBtn) {
        visible = false;
        footer.style.opacity = '0';
        footer.style.pointerEvents = 'none';
        toggleBtn.textContent = '▲';
      }
    }, true);
  }
});

//https://sciencexpert.github.io/SMILE/Hansen/Mobile_Version/Menu - Mobile.html
</script>
</body>
</html>
