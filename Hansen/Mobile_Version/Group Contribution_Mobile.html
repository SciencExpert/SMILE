<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SciencExpert_Calculateur HSP - Hansen</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}
.container {
  display: flex;
  height: 100vh;
  flex-wrap: nowrap;
}
/* Panels */
#leftPanel, #rightPanel {
  width: 100%;
  padding: 5px;
  box-sizing: border-box;
  overflow-y: auto;
}
#leftPanel {
  background-color: #d6e1d5;
  flex: 1 1 35%;
  border-right: 1px solid #ccc;
  text-align: center;
  min-width: 250px;
}
#rightPanel {
  background-color: #fff;
  flex: 1 1 65%;
  min-width: 800px;
}
/* Table styling */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 1rem;
}
th, td {
  padding: 6px;
  border: 1px solid #ccc;
  text-align: center;
}
input, select {
  width: 100%;
  box-sizing: border-box;
}
/* Buttons */
.predict-button {
  display: inline-block;
  background-color: #0076b6;
  color: white;
  border: none;
  padding: 10px 20px;
  margin: 2px;
  font-size: 1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.2s ease;
}
.predict-button:hover {
  background-color: #005f90;
  transform: scale(1.05);
}
/* Footer */
#footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #f0f0f0;
  color: black;
  text-align: center;
  padding: 8px 0;
  font-size: 14px;
  border-top: 1px solid #ccc;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
@media (hover: hover) and (pointer: fine) {
  body:hover #footer {
    opacity: 1;
    pointer-events: auto;
  }
}
#footerToggleBtn {
  display: none;
  position: fixed;
  bottom: 18px;
  right: 12px;
  background: #555;
  color: white;
  border-radius: 20px;
  padding: 8px 12px;
  z-index: 2001;
  cursor: pointer;
  font-size: 1.3em;
}
/* Popup */
.popup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  border: 1px solid #ccc;
  padding: 20px;
  z-index: 3000;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  max-width: 90%;
  max-height: 80%;
  overflow-y: auto;
  border-radius: 8px;
}
.popup-close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #0076b6;
  border: none;
  color: white;
  font-size: 1.2rem;
  padding: 5px 10px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 3100;
  transition: background-color 0.3s ease;
}
.popup-close-btn:hover {
  background: #005f90;
}
/* Responsive */
@media (max-width: 900px) {
  .container {
    flex-direction: column;
    height: auto;
  }
  #leftPanel, #rightPanel {
    flex: none;
    width: 100%;
    min-width: auto;
    border-right: none;
    border-bottom: 1px solid #ccc;
  }
  table {
    font-size: 0.9em;
  }
  .predict-button {
    width: 100%;
    font-size: 1.1em;
  }
  #footerToggleBtn {
    display: block;
  }
  #footer {
    opacity: 1;
    pointer-events: auto;
    position: fixed;
    bottom: 50px;
  }
}
@media (max-width: 500px) {
  table {
    font-size: 0.85em;
  }
  .predict-button {
    font-size: 1em;
    padding: 8px;
  }
  #footer {
    font-size: 0.9em;
  }
  #leftPanel, #rightPanel {
    min-width: auto !important;
  }
}
@media (max-width: 768px) {
  .popup {
    top: 0;
    left: 0;
    transform: none;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    border-radius: 0;
    padding: 15px;
  }
  .popup-close-btn {
    top: 15px;
    right: 15px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div id="leftPanel">
    <h2>Panel gauche</h2>
    <p>Contenu du panneau gauche</p>
    <table>
      <thead>
        <tr><th>Col 1</th><th>Col 2</th></tr>
      </thead>
      <tbody>
        <tr><td>Valeur 1</td><td>Valeur 2</td></tr>
        <tr><td>Valeur 3</td><td>Valeur 4</td></tr>
      </tbody>
    </table>
    <button class="predict-button">Bouton</button>
  </div>
  <div id="rightPanel">
    <h2>Panel droit</h2>
    <p>Contenu du panneau droit</p>
    <table>
      <thead>
        <tr><th>Col A</th><th>Col B</th></tr>
      </thead>
      <tbody>
        <tr><td>Valeur A</td><td>Valeur B</td></tr>
        <tr><td>Valeur C</td><td>Valeur D</td></tr>
      </tbody>
    </table>
    <button class="predict-button">Bouton</button>
  </div>
</div>
<div id="footer">Pied de page</div>
<button id="footerToggleBtn">☰</button>
</body>
</html>
