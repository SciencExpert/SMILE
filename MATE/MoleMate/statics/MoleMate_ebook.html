      <h1> Chapter 1: Chemometrics: <br>Turning Chemical Data into Knowledge </h1>
<div style="text-align:justify">
<h2>1.1. The base of chemometrics </h2>
<div style="text-align:justify;font-size:1em;line-height:1.3em">
Chemometrics is the science of extracting relevant information from chemical data by applying mathematical, statistical, and computational methods. As modern analytical chemistry produces increasingly complex and high-dimensional datasets, chemometrics has become essential for interpreting measurements, understanding underlying chemical phenomena, and supporting reliable decision-making.

<br>One of the foundational principles of chemometrics is multivariate data analysis. Unlike univariate approaches, which examine one variable at a time, chemometric methods consider all variables simultaneously. This is particularly important for analytical techniques such as NMR, IR, Raman spectroscopy, mass spectrometry, and chromatography, where each measurement may contain hundreds or thousands of correlated variables.

<br>A classical example is Principal Component Analysis (PCA), widely used to explore spectral data. PCA allows chemists to visualize similarities and differences between samples,
 detect outliers, and identify dominant sources of variation. For instance, PCA is commonly applied in quality control to distinguish compliant products from off-specification batches, 
or in food and pharmaceutical analysis to detect adulteration or counterfeit products.
</div>

</div>
<div class="footer"><h2><a href="#page-2" data-page="2">Menu</a></h2></h2><span>Page 4</span></div>
</template>
<!-------------------------Page5--------->

<template id="page-4">  
<div style="text-align:justify;font-size:1em;line-height:1.3em">
<br>Another cornerstone of chemometrics is regression modeling, such as Partial Least Squares (PLS). PLS models are extensively used to correlate spectral data with chemical or physical properties, including concentration, purity, or biological activity. In pharmaceutical development, PLS models enable real-time process monitoring (PAT – Process Analytical Technology) by predicting critical quality attributes directly from spectroscopic measurements, reducing the need for time-consuming laboratory analyses.

<br>Chemometrics also plays a central role in chemical identification and structure–property relationships. Multivariate pattern recognition techniques are applied to spectral libraries to identify unknown compounds based on similarity to known references. In mass spectrometry, chemometric classification methods help distinguish compounds with overlapping fragmentation patterns, while in NMR spectroscopy they assist in resolving complex mixtures and confirming molecular structures.

<br>In the context of chemical databases and molecular informatics, chemometrics supports the analysis of large collections of molecules by converting chemical structures into numerical descriptors. 
These descriptors can represent physicochemical properties, topological indices, or spectral features.
</div>

<div style="text-align:justify;font-size:1em;line-height:1.3em">
Clustering and similarity analysis are then used to group molecules with comparable properties, 
supporting applications such as:<ul>

<li>lead discovery and optimization in drug development</li>

<li>identification of functional analogs or safer substitutes</li>

<li>exploration of structure–activity relationships (SAR)</li></ul>

<br>With the rise of machine learning, chemometrics has expanded to include advanced classification algorithms, such as support vector machines, random forests, and neural networks. These methods are increasingly used to predict toxicity, reactivity, or environmental impact, enabling safer and more sustainable chemical design.

<br><br>Overall, chemometrics provides a rigorous framework that connects experimental data, molecular structure, and chemical knowledge. It transforms raw measurements into interpretable models, accelerates research workflows, and reduces uncertainty—making it a foundational discipline for data-driven chemistry.
</div>

<div style="text-align:justify;font-size:1em;line-height:1.3em">
<h2>1.2. Chemical Databases and the Value of Structured Information </h2>
 <div style="text-align:justify">

The rapid expansion of chemical knowledge has led to the emergence of large, open-access chemical databases that are now indispensable to modern chemists. Among them, PubChem has become a central reference, aggregating tens of millions of chemical structures and linking them to physicochemical properties, biological activities, toxicological data, safety information, and curated references from the scientific literature. Such databases form the backbone of data-driven chemistry.

<br><br>A key strength of databases like PubChem lies in their use of standardized molecular identifiers, including Compound Identification numbers (CID), molecular formulas, SMILES strings, Mol files, and InChI/InChIKey representations. These standardized formats enable interoperability between experimental data, computational tools, regulatory systems, and chemometric workflows. They allow chemical information to be consistently stored, queried, and analyzed across platforms and disciplines.

<br><br>From a chemometric perspective, structured databases provide the raw material for multivariate analysis and modeling. Molecular structures can be translated into numerical descriptors—such as molecular weight, polarity, functional groups, or spectral features—which serve as inputs for chemometric methods. This enables similarity analysis, clustering, classification, and property prediction at scales that would be impossible using manual approaches.


</div>

<h2>1.3. Practical Applications Enabled by Chemical Databases</h2>
<div style="text-align:justify;font-size:1em;line-height:1.3em">
Chemical databases support a wide range of practical applications when combined with chemometric methods:

<br><br>👀 <strong>Compound identification</strong>: Spectral data (NMR, IR, MS) can be compared against reference spectra stored in databases to confirm molecular identity or narrow down candidate structures using pattern recognition techniques.

<br><br>☠️ <strong>Safety and risk assessment</strong>: Access to hazard statements, toxicity data, and regulatory classifications allows chemists to assess risks early in the development process. Chemometric models can further correlate structural features with toxicological outcomes, supporting safer chemical design.

<br><br>💊 <strong>Drug discovery and bioactivity analysis</strong>: PubChem bioassay data enable structure–activity relationship (SAR) studies, where chemometric regression and classification models identify molecular features associated with biological effects.

<br><br>🔂 <strong>Substance substitution and sustainability:</strong> By clustering molecules based on structural and physicochemical similarity, chemometric analysis of database content helps identify alternative compounds with comparable performance but improved safety or environmental profiles.
</div>

<h2>1.4. Challenges of Scale and Heterogeneity</h2>
<div style="text-align:justify;font-size:1.1em;line-height:1.3em">

<br><br>Chemical databases support a wide range of practical applications when combined with chemometric methods:
<br><br>Despite their richness, chemical databases present significant challenges. The volume of data is immense, and information is often distributed across multiple records, formats, and levels of curation. Spectral data, safety annotations, and property values may originate from different sources, with varying degrees of completeness and reliability.

<br><br>Manual navigation of such databases is therefore inefficient and prone to error. Extracting relevant information for a single molecule—such as its identifiers, safety phrases, available spectra, and structurally similar compounds—often requires switching between multiple tools and interpreting heterogeneous data representations. This fragmentation limits the effective use of chemometric techniques, which rely on well-organized, consistent input data.


</div>

<strong><u>Sources of Synonyms</u></strong>
<br><strong>MoleMate™</strong> aggregates synonyms from a wide range of authoritative and community-driven sources. These include:
<br>➡️ <strong>Depositor-provided names:</strong> Chemical names submitted by data contributors,i.e. research institutions,companies & regulatory agencies.
<br>➡️ <strong>Scientific and regulatory databases:</strong> Including resources such as MeSH, ChEBI, FDA Substance Registration System (SRS), EPA databases...
<br>➡️ <strong>Literature-derived names:</strong> Common or historical names extracted from patents, publications, and technical documentation.
<br>➡️ <strong>Trade names and commercial identifiers</strong>: Where available, particularly for pharmaceuticals, agrochemicals, and industrial substances.
<br>
<br>As a result, a  compound is associated with a larege number of synonyms, due to these differences.<strong>MoleMate™</strong> gives all these synonyms.

<br><br><strong><u>Common Name vs. IUPAC Name</u></strong>

Among the available synonyms, two categories are particularly important:

<br>➡️ <strong>Common names</strong> : 
These are widely used, human-readable names that are often preferred in laboratory practice, education, and industry.They may be ambiguous or shared by different compounds in different contexts.

<br>➡️ <strong>IUPAC name</strong> : 
The IUPAC name is the systematic, unambiguous name defined by the rules of the International Union of Pure and Applied Chemistry.

<h2>5.1 IR simulator</h1>
<div style="text-align:justify;font-size:1em;line-height:1.3em">

<strong><u>5.1.1 Infrared (IR) Spectroscopy – Short Introduction</u></strong>
<br><br>Infrared (IR) spectroscopy is an analytical technique based on the interaction between infrared radiation and molecular vibrations. When a molecule absorbs IR light, specific bonds vibrate by stretching or bending at characteristic frequencies. An absorption occurs only if the vibration produces a change in the molecular dipole moment, which makes IR spectroscopy particularly sensitive to polar bonds.
<br><br>The resulting IR spectrum consists of absorption bands that correspond to these vibrational modes. Stretching vibrations (such as C–H, O–H, or N–H) typically appear at higher wavenumbers, while bending vibrations occur at lower wavenumbers. Functional groups give rise to characteristic absorption regions, allowing rapid identification, while the complex pattern in the fingerprint region (below ~1500 cm⁻¹) is unique to each molecule.
<br><br>In practice, IR spectroscopy is widely used for functional group identification, compound verification, purity control, and comparison of unknown samples with reference spectra. It is a fast, non-destructive technique and remains one of the most powerful tools for confirming molecular structure in both research and industrial laboratories.

<h2>5.2 Proton Nuclear Magnetic Resonance (¹H NMR) Spectroscopy</h1>
<div style="text-align:justify;font-size:0.8em;line-height:1.3em">

<strong><u>5.2.1. Proton Nuclear Magnetic Resonance  Theory</strong></u>
<br>Proton Nuclear Magnetic Resonance (¹H NMR) spectroscopy is based on the interaction between nuclear spins and an external magnetic field. Hydrogen nuclei (¹H) possess a nuclear spin (I = ½) and a magnetic moment. When placed in a strong magnetic field, these spins align either with or against the field, creating distinct energy levels. Absorption of radiofrequency (RF) radiation induces transitions between these energy levels, producing the NMR signal.
<br>The exact resonance frequency of a proton depends on its electronic environment. Electrons surrounding the nucleus generate local magnetic fields that shield or deshield the proton from the external field. This effect gives rise to the chemical shift (δ), expressed in parts per million (ppm), which provides direct information about the chemical environment of each proton.
<br>In addition, magnetic interactions between neighboring protons lead to spin–spin coupling, producing signal splitting patterns (doublets, triplets, multiplets). The spacing between these lines, known as the coupling constant (J, in Hz), reflects the number and spatial relationship of adjacent nuclei. Together, chemical shifts and coupling patterns encode detailed structural information.
<br><br>
<strong><u>5.2.2. Practical Aspects of ¹H NMR</strong></u>
<br>In practice, ¹H NMR spectra are recorded by dissolving a sample in a deuterated solvent (such as CDCl₃ or DMSO-d₆) to avoid interference from solvent protons and to provide a stable magnetic lock signal. Spectra are typically acquired on instruments operating at 400–600 MHz or higher, where increased magnetic field strength improves resolution and sensitivity.
<br><br>Key practical features of a ¹H NMR spectrum include:
<div style="margin-left:50px">
    ✅Chemical shift positions, indicating functional groups and electronic environments
<br>✅Signal integration, proportional to the number of equivalent protons
<br>✅Multiplicity, revealing the number of neighboring protons through coupling
<br>✅Line width & shape, influenced by instrument tuning, purity, and molecular dynamics
<br>✅Proper shimming, temperature control, and solvent choice are essential for obtaining high-quality spectra.
</div>

<strong><u>5.2.3.Final Applications of ¹H NMR</strong></u>
<br>¹H NMR spectroscopy is one of the most widely used analytical techniques in chemistry due to its versatility and rich information content. Its main applications include:
<div style="margin-left:45px">
    ✅ Structure elucidation of  molecules, from small compounds to complex natural products
<br>✅ Compound identification and verification, by comparison with reference spectra
<br>✅ Purity assessment and impurity detection in research and industrial settings

</div>
<br>Because it is non-destructive, highly informative, and broadly applicable, ¹H NMR remains a cornerstone technique in organic chemistry, pharmaceutical research, materials science, and chemical education.

<h2>5.3 Carbon-13 Nuclear Magnetic Resonance Spectroscopy</h1><br>
<div style="text-align:justify;font-size:0.8em;line-height:1.3em">
<strong><u>5.3.1. Carbon-13 Nuclear Magnetic Resonance  Theory</strong></u>

<br>Carbon-13 Nuclear Magnetic Resonance (¹³C NMR) spectroscopy is based on the same physical principles as proton NMR but focuses on the ¹³C isotope, 
which has a nuclear spin of ½ and is NMR-active. Although carbon is a central element in organic molecules, only about 1.1% of natural carbon is ¹³C, making ¹³C NMR inherently 
less sensitive than ¹H NMR.
<br><br>When placed in a strong magnetic field, ¹³C nuclei absorb radiofrequency radiation at frequencies determined by their electronic environment. 
The surrounding electrons shield the carbon nucleus to varying degrees, leading to chemical shifts (δ) that are highly sensitive to functional groups, hybridization state, and bonding patterns. 
As a result, ¹³C NMR spectra typically span a wide range (0–220 ppm), providing excellent chemical dispersion.
<br><br>
<strong><u>5.3.2. Practical Aspects of ¹³C NMR</strong></u>
<br>In practice, ¹³C NMR spectra are acquired using Fourier Transform NMR (FT-NMR) techniques and usually require longer acquisition times than ¹H NMR due to lower sensitivity. To simplify spectra and improve signal-to-noise ratio, most ¹³C NMR experiments are recorded with proton decoupling, which removes carbon–hydrogen coupling and results in single, sharp peaks for each unique carbon environment.
Key practical characteristics of ¹³C NMR include:
<div style="margin-left:50px">
✅Broad chemical shift range, allowing clear distinction between different carbon types
<br>✅ Decoupled spectra, where each signal corresponds to a chemically distinct carbon
<br>✅ Lower sensitivity, requiring higher sample concentration or longer acquisition times
<br>✅ Signal intensity not directly proportional to carbon count, due to relaxation effects and Nuclear Overhauser Enhancement (NOE)
<br>✅ Specialized experiments such as DEPT can be used to differentiate between CH₃, CH₂, CH, and quaternary carbons, adding further structural insight.
</div>
</div>

<strong><u>5.3.3. Applications of ¹³C NMR</strong></u>
<br>¹³C NMR spectroscopy is a powerful complementary technique to ¹H NMR and is essential for comprehensive structural analysis. Its main applications include:
<div style="margin-left:50px">
    ✅ Confirmation of molecular skeletons : number & types of ¹³C environments

<h2>5.4 Mass Spectroscopy</h1><br>
<div style="text-align:justify;font-size:0.8em;line-height:1.3em">
<strong><u>5.4.1. Mass Spectroscopy Theory</strong></u><br>
Mass spectrometry (MS) is an analytical technique based on the measurement of the mass-to-charge ratio (m/z) of ionized chemical species. 
In a mass spectrometer, molecules are converted into ions through an ionization process, creating charged particles that can be manipulated and analyzed using electric and/or magnetic fields. 
Only ions with specific m/z values reach the detector, generating the mass spectrum.
<br><br>
The position of each peak in the spectrum corresponds to a particular m/z value, while the intensity reflects the relative abundance and stability of the ion.
The molecular ion (or quasi-molecular ion) provides direct information about the molecular weight of the compound. Additional peaks arise from fragment ions, 
formed when the molecular ion undergoes characteristic bond cleavages during or after ionization. These fragmentation pathways are governed by molecular structure and ion stability,
producing patterns that are highly informative for structural analysis.
<br><br>
<strong><u>5.4.2. Practical Aspects of Mass Spectrometry</strong></u><br>
In practice, mass spectrometry can be performed using a variety of ionization techniques (such as electron ionization, electrospray ionization, or chemical ionization) 
and mass analyzers (quadrupole, time-of-flight, ion trap, or orbitrap). The choice of technique depends on the nature of the sample and the level of structural information required.

Key practical features of a mass spectrum include:
<div style="margin-left:50px">
    ✅ m/z values, indicating molecular and fragment ion masses
<br>✅ Relative peak intensities, reflecting ion stability and abundance
<br>✅ Isotopic patterns, providing information on elemental composition
<br>✅ Fragmentation patterns, revealing structural subunits and bonding
</div>
Mass spectrometry can analyze very small sample quantities and is often coupled with separation techniques such as gas or liquid chromatography to handle complex mixtures.

</div>

<br>
<strong><u>5.4.3.Final Applications of Mass Spectrometry</strong></u><br>

Mass spectrometry is a cornerstone analytical method across many scientific fields due to its sensitivity, speed, and structural insight. Its main applications include:
<div style="margin-left:50px">
    ✅Molecular weight determination and elemental composition analysis
<br>✅Compound identification and structural elucidation
<br>✅Detection of impurities and trace components
<br>✅Complex mixtures analysis in environmental, pharmaceutical, and biological samples
<br>✅Confirmation of synthetic products and reaction monitoring
</div>
By providing precise mass information and characteristic fragmentation data, mass spectrometry plays a critical role in modern chemical analysis, complementing spectroscopic techniques such as NMR and IR for comprehensive molecular characterization.

</div>

<hr><h2>6.2. Tanimoto Selection Protocol<hr></h2>
The Tanimoto selection protocol compares 2D molecular fingerprints (structural patterns, not physicochemical properties) between more than 1M compounds in the PubChem DataBase. 
It computes a Tanimoto similarity score and selects molecules whose 2D structural features are most similar to the chosen reference.

<h2><hr>6.3. Clustering Approach (PCA for Principal Component Analysis/UMAP for Uniform Manifold Approximation and Projection)<hr></h2>
The clustering uses the properties (MW, XLogP, TPSA, complexity, etc.) to describe each compound numerically. <strong>PCA & UMAP</strong> reduces the multidimensional 
property vectors into 2D space, allowing molecules with similar  profiles to group together. Clusters reveal families based on shared physicochemical features.<br>
<strong>PCA</strong> is a linear dimensionality-reduction method that transforms molecular property data into a smaller set of components.
It preserves the largest variance in the dataset and produces results that are easy to interpret.<br>
<strong>UMAP</strong> is a non-linear dimensionality-reduction method that builds a graph based on local relationships between molecules.
It preserves local structure, meaning it groups very similar molecules tightly together.
</div>

<template id="page-58">
<div style="text-align:justify;font-size:0.8em;line-height:1.3em">

4️⃣  <strong><u>Launch clustering in property space</u></strong>

<br>Choose the dimensionality‑reduction method: PCA (linear, interpretable) or UMAP (nonlinear, local structure‑preserving) and then 
select the desired number of clusters K, then run the clustering to partition the molecules.

<div>PCA and UMAP both take your property matrix (one row per molecule, one column per descriptor) and learn a new 2D coordinate system that preserves structure in the data,
 but they do it with very different mathematics and have different behaviors.</div>

<br><strong>📊 Data used for both methods : </strong>
Each molecule is represented by a <span class="highlight">feature vector</span>: <code>[x₁, x₂, …, x_d]</code> 
where <code>x_i</code> can be MW, XLogP, TPSA, HBD, HBA, rotatable bonds, complexity, etc.
<br>These vectors form an <code>N×d</code> matrix (N molecules, d descriptors); dimensionality reduction replaces this by an <code>N×2</code>
 matrix used for plotting.
<div style="margin-left:50px">             
<strong><u>🔵 PCA: Linear Variance-Maximizing Projection</u></strong>
 The core Idea is to find  orthogonal directions (principal components) that capture as much variance as possible and then
use the first two [PC1 & PC2]  as the 2D axes. The computation steps are :
            <ol>
                <li>Center (and often scale) each descriptor so that it has mean 0 (and possibly unit variance), which prevents high-magnitude features from dominating.</li>
                <li>Compute the <span class="highlight">covariance matrix</span> <code>C = 1/(N−1) X⊤X</code>, which encodes how properties co-vary across molecules.</li>
                <li><span class="highlight">Diagonalize C</span>: eigenvectors give directions in property space; eigenvalues give variance captured along each direction.</li>
                <li>Sort eigenvectors by eigenvalue; the first principal component (PC1) is the direction of maximum variance, PC2 is orthogonal to PC1 and captures the next largest variance, etc.</li>
                <li>Project each molecule onto PC1 and PC2, giving 2D coordinates; this is just a linear transformation (matrix multiplication).</span></li>
            </ol>
The <strong>[PC1]</strong>  is often a weighted combination of properties like MW, XLogP, TPSA, etc., and can sometimes be interpreted as a <strong>"size/lipophilicity" axis</strong>, 
depending on loadings.
<br>PCA  preserves distances far apart on the map generally correspond to large differences in the original property vectors, 
but local neighborhoods are not always optimal.
PCA is linear and deterministic thus stable & reproducible: same data give same 2D embedding.
</div>

</div>

<template id="page-59">
<div style="text-align:justify;font-size:0.8em;line-height:1.3em">
<div style="margin-left:50px">
<strong><u>🔴 UMAP: Nonlinear Manifold & Graph-Based Embedding</u></strong>
<br>The core Idea is to assume molecules lie on a low-dimensional manifold embedded in high-dimensional property space; 
approximate this manifold as a graph in high dimensions, then find a 2D layout that preserves the graph structure. <br><br> The  High-Dimensional Graph Construction is obtained : 
<ul>
                <li>🏡 Define a <strong>neighborhood size</strong> parameter (typically <i>n_neighbors</i>) that sets how many nearest neighbors 
each molecule should consider as "local".</li>
                <li>🗺️ Compute Euclidean distances between molecules in property space; build a weighted k-nearest-neighbor graph where edge weights 
reflect how close two molecules are.</li>
                <li>🔀 Convert neighbor relations into a <strong>fuzzy topological representation</strong>: for each pair of neighbors, 
compute a membership strength (probability of being connected in the manifold).</li>
     
<li>🎲 Initialize 2D coordinates randomly (or using PCA as a warm start), then optimize them with stochastic gradient descent.</li>
   </ul>
<br>The optimization tries to ensure that molecules connected with high probability in high-D remain close in 2D, while non-neighbors are pushed apart;
 this minimizes a cross-entropy-like objective between high-D and low-D neighbor graphs.</li>

<br><br>UMAP preserves local structure better than PCA: very similar molecules (in property space) tend to form tight clusters in 2D, which is desirable for analog series and chemotype discovery.
<br><br>Because it is nonlinear and graph-based, UMAP can reveal <strong>curved manifolds</strong> or <strong>non-linear relationships</strong> between properties that PCA cannot capture.
<br><br>UMAP is more sensitive to hyperparameters and random seed; different runs can slightly reposition clusters, but local neighborhoods remain similar.


</div>
</div>

<div class="math">
            <strong>In Practice for Chemical Space:</strong><br>
            🔵 PCA gives a <strong>global overview</strong> and interpretable axes (e.g., PC1 correlating with MW/XLogP, PC2 with polarity or complexity).<br>
            🔴 UMAP gives <strong>fine-grained neighborhoods</strong> and <strong>well-separated</strong> local clusters, helpful to identify close analogs and subtle subfamilies.</span>
        </div>
