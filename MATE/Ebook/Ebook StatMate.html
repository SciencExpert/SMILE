<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>SciencExpert-StatMate Ebook</title>
<style>
  * {
    box-sizing: border-box;
  }
  
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(135deg, #faf3e0 0%, #f0e6d2 100%);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .book-container {
    position: relative;
    width: 90vw;
    height: 85vh;
    max-width: 1200px;
    perspective: 2200px;
    border-radius: 18px;
    user-select: none;
    background: linear-gradient(to right, white 20%, #CCCC 50%, white 80%);
  }

  .spine {
    position: absolute;
    width: 5px;
    height: 90%;
    background: #cccc;
    border-radius: 3px;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
    z-index: 30;
  }

  .page {
    width: 50%;
    height: 100%;
    border-radius: 18px;
    border: solid 1px #cccc;
    padding: 20px;
    box-sizing: border-box;
    position: absolute;
    top: 0;
    display: flex;
    flex-direction: column;
    backface-visibility: hidden;
    transform-style: preserve-3d;
    font-size: clamp(0.7rem, 1.5vw, 1.1rem);
    line-height: 1.5em;
    cursor: default;
    background: white;
    overflow-y: auto;
  }

  .page.left {
    left: 0;
    transform-origin: right center;
    z-index: 20;
    box-shadow: inset -10px 0 15px -10px rgba(0,0,0,0.2), 
                0 0 10px 0 rgba(165,42,42,0.08);
  }

  .page.right {
    right: 0;
    transform-origin: left center;
    z-index: 40;
    box-shadow: inset 10px 0 15px -10px rgba(0,0,0,0.2),
                0 0 10px 0 rgba(165,42,42,0.08);
  }

  .page.transparent {
    width: 60%;
    background: linear-gradient(135deg, #faf3e0 0%, #f0e6d2 100%);
    box-shadow: none;
    border: none;
    border-radius: 0;
  }

  @keyframes flipRightForward {
    0%   { transform: rotateY(0) translateX(0); }
    40%  { transform: rotateY(-110deg) translateX(-10%); }
    100% { transform: rotateY(-180deg) translateX(-20%); }
  }

  @keyframes flipLeftForward {
    0%   { transform: rotateY(0) translateX(0); }
    40%  { transform: rotateY(110deg) translateX(10%); }
    100% { transform: rotateY(180deg) translateX(20%); }
  }

  .flip-right {
    animation: flipRightForward 1s ease forwards;
    z-index: 100 !important;
  }

  .flip-left {
    animation: flipLeftForward 1s ease forwards;
    z-index: 100 !important;
  }

  .nav-btn {
    position: absolute;
    top: 50%;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #a52a2a;
    color: white;
    font-size: 2em;
    line-height: 50px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    user-select: none;
    transform: translateY(-50%);
    transition: background-color 0.3s;
    z-index: 110;
  }

  .nav-btn:hover {
    background-color: #d97474;
  }

  .nav-left {
    left: -70px;
  }

  .nav-right {
    right: -70px;
  }

  .page h1 {
    margin: 0 0 15px;
    color: #a52a2a;
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
  }

  .page h2 {
    margin: 10px 0;
    color: black;
    font-size: clamp(1rem, 2vw, 1.3rem);
  }

  .page p {
    margin: 0 0 15px;
    color: black;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    text-align: justify;
    line-height: 1.4em;
  }

  .page ul {
    margin: 5px 0;
    padding: 0 0 0 20px;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
  }

  .page li {
    margin: 5px 0 5px 10px;
    line-height: 1.4em;
  }

  .page img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 10px auto;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: clamp(0.6rem, 1.2vw, 0.8rem);
    text-align: center;
    margin: 10px 0;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 5px;
  }

  th {
    background-color: #f5f5f5;
  }

  .header-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5px;
    font-size: clamp(0.7rem, 1.4vw, 0.9rem);
  }

  .header-line h2 {
    margin: 0;
    flex: 1;
  }

  .header-line a {
    text-decoration: none;
    color: #A52A2A;
    font-weight: bold;
    white-space: nowrap;
  }

  .continue {
    background-color: transparent;
    text-align: center;
    margin: 10px 0;
    font-weight: bold;
    font-size: clamp(0.9rem, 1.8vw, 1.2rem);
    color: #ccc;
    cursor: pointer;
  }

  .continue span {
    padding: 0 10px;
    background: #fff;
    color: #ccc;
  }

  .footer {
    font-size: clamp(0.7rem, 1.3vw, 0.9rem);
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: transparent;
    border-top: 2px solid #ccc;
  }

  .footer h2 {
    margin: 0;
    font-size: inherit;
  }

  /* Image overlay */
  .img-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .img-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .img-overlay .img-wrap {
    max-width: 95vw;
    max-height: 95vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .img-overlay img {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border-radius: 6px;
    cursor: zoom-out;
  }

  /* RESPONSIVE MOBILE */
  @media (max-width: 768px) {
    .book-container {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      background: white;
    }

    .spine {
      display: none;
    }

    .page {
      width: 100%;
      height: 100%;
      border-radius: 0;
      padding: 15px;
      font-size: 0.9rem;
    }

    .page.left {
      left: 0;
    }

    .page.right {
      right: 0;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      font-size: 1.5em;
      line-height: 40px;
    }

    .nav-left {
      left: 10px;
    }

    .nav-right {
      right: 10px;
    }

    .footer {
      padding: 8px 15px;
      font-size: 0.75rem;
    }

    .page h1 {
      font-size: 1.3rem;
    }

    .page h2 {
      font-size: 1.1rem;
    }

    table {
      font-size: 0.65rem;
    }
  }

  @media (max-width: 480px) {
    .page {
      padding: 10px;
      font-size: 0.85rem;
    }

    .page h1 {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .page h2 {
      font-size: 1rem;
    }

    .page p, .page li {
      font-size: 0.85rem;
    }

    .nav-btn {
      width: 35px;
      height: 35px;
      font-size: 1.3em;
      line-height: 35px;
    }

    .footer {
      font-size: 0.7rem;
      padding: 5px 10px;
    }

    table {
      font-size: 0.6rem;
    }

    th, td {
      padding: 3px;
    }
  }
</style>
</head>
<body>

  <div style="text-align:center; height:100%; display:flex; align-items:center; justify-content:center;">
    <div>
      <h1 style="font-style:italic; font-family:Georgia; font-size:clamp(2rem, 5vw, 3.5rem); font-weight:bold; letter-spacing:0.1em; color:#2c2c2c; margin:20px 0;">

      </h1>
      <p style="font-size:clamp(1rem, 2vw, 1.3rem); margin-top:20px;">

      </p>
      <p style="font-size:clamp(0.9rem, 1.8vw, 1.1rem); margin-top:40px;">

      </p>
    </div>
  </div>
</template>

<template id="page-0">
  <div style="text-align:center">
    <h1 style="font-style:italic; font-family:Georgia; font-size:clamp(1.8rem, 4vw, 3em); font-weight:bold; letter-spacing:0.1em; color:#2c2c2c; margin:20px 0;">
      StatMate™
    </h1>
    <hr>
    <p style="font-style:italic; font-family:Georgia;">
      SciencExpert Ed.<br>2025
    </p>
  </div>

  <div style="font-size:clamp(0.8rem, 1.5vw, 1rem); line-height:1.5em; margin-top:20px;">
    <h1>Table of Contents</h1>
    <div class="header-line"><h2>Chapter 1: Descriptive Statistics</h2><span><a href="#page-2" data-page="2">Page 2</a></span></div>
    <div class="header-line"><h2>Chapter 2: Dendrogram Clusters</h2><span><a href="#page-6" data-page="6">Page 6</a></span></div>

</template>

<template id="page-1">
  <h1>Chapter 1: Descriptive Statistics</h1>
  <p>
    Descriptive statistics summarize and describe the main features of a dataset, providing a clear overview of the data's distribution, central tendency, and variability.
  </p>
  
  <h2>Distribution Profiles</h2>
  <p>
    The distribution describes how values are arranged across their range:
  </p>
  <ul>
    <li><strong>Normal (Bell-shaped):</strong> Balanced, mean ≈ median ≈ mode</li>
    <li><strong>Right-Skewed:</strong> Most values low, long tail right</li>
    <li><strong>Left-Skewed:</strong> Most values high, tail left</li>
    <li><strong>Bimodal:</strong> Two distinct groups or peaks</li>
  </ul>

  <h2>Key Indicators</h2>
  <ul>
    <li><strong>Mean:</strong> Arithmetic average</li>
    <li><strong>Median:</strong> Middle value (robust to outliers)</li>
    <li><strong>Mode:</strong> Most frequent value</li>
    <li><strong>Standard Deviation:</strong> Measure of spread</li>
    <li><strong>IQR:</strong> Interquartile range (middle 50%)</li>
  </ul>

  <div class="footer">
    <h2><a href="#page-0" data-page="0">Menu</a></h2>
    <span>Page 2</span>
  </div>
</template>

<template id="page-2">
  <h2>Applications</h2>
  
  <p><strong>Education:</strong> Analyze test score distributions to identify student groups and target instruction effectively.</p>
  
  <p><strong>Business:</strong> Understand customer behavior patterns, identify top performers, and segment markets.</p>
  
  <p><strong>Healthcare:</strong> Use robust statistics for medical data, detect outliers for clinical review.</p>
  
  <p><strong>Sports:</strong> Evaluate performance consistency and identify exceptional results.</p>

  <h2>Choosing Indicators</h2>
  <ul>
    <li><strong>Symmetrical data:</strong> Use mean and SD</li>
    <li><strong>Skewed data:</strong> Prefer median and IQR</li>
    <li><strong>With outliers:</strong> Use robust measures</li>
    <li><strong>Bimodal:</strong> Consider splitting dataset</li>
  </ul>

  <div class="footer">
    <h2><a href="#page-0" data-page="0">Menu</a></h2>
    <span class="continue" onclick="flipRight()">Continue →</span>
    <span>Page 3</span>
  </div>
</template>

<div class="book-container">
  <div class="spine"></div>
  <div class="nav-btn nav-left" id="nav-left">◄</div>
  <div class="nav-btn nav-right" id="nav-right">►</div>
</div>

<script>
let tempo = 300;

const allTemplates = Array.from(document.querySelectorAll('template[id^="page-"]'));
allTemplates.sort((a, b) => {
  const aNum = parseInt(a.id.replace('page-', ''), 10);
  const bNum = parseInt(b.id.replace('page-', ''), 10);
  return aNum - bNum;
});

const pagesIndexes = allTemplates.map(tpl => parseInt(tpl.id.replace('page-', ''), 10));
let currentLeftIndexPos = 0;
let currentRightIndexPos = 1;
const book = document.querySelector('.book-container');
let leftPage = null;
let rightPage = null;

function createPage(pagePosInArray, side) {
  const tpl = allTemplates[pagePosInArray];
  const div = document.createElement('div');
  div.classList.add('page', side);
  if (pagesIndexes[pagePosInArray] === -1) div.classList.add('transparent');
  div.appendChild(tpl.content.cloneNode(true));
  
  div.querySelectorAll('a[data-page]').forEach(link => {
    link.style.color = "#A52A2A";
    link.addEventListener('click', function (e) {
      const targetPage = parseInt(link.getAttribute('data-page'), 10);
      if (pagesIndexes.includes(targetPage)) {
        e.preventDefault();
        gotoPage(targetPage);
      }
    });
  });
  
  return div;
}

function clearFlipClasses() {
  if (leftPage) {
    leftPage.classList.remove('flip-left');
    leftPage.style.zIndex = '';
  }
  if (rightPage) {
    rightPage.classList.remove('flip-right');
    rightPage.style.zIndex = '';
  }
}

function render() {
  clearFlipClasses();
  if (leftPage) leftPage.remove();
  if (rightPage) rightPage.remove();
  
  if (currentLeftIndexPos < 0) currentLeftIndexPos = 0;
  if (currentRightIndexPos < 1) currentRightIndexPos = 1;
  if (currentLeftIndexPos > allTemplates.length - 2) currentLeftIndexPos = allTemplates.length - 2;
  if (currentRightIndexPos > allTemplates.length - 1) currentRightIndexPos = allTemplates.length - 1;
  
  leftPage = createPage(currentLeftIndexPos, 'left');
  rightPage = createPage(currentRightIndexPos, 'right');
  book.appendChild(leftPage);
  book.appendChild(rightPage);
}

function flipRight() {
  if (currentRightIndexPos >= allTemplates.length - 2) return;
  rightPage.classList.add('flip-right');
  rightPage.style.zIndex = 100;
  setTimeout(() => {
    currentLeftIndexPos = currentRightIndexPos + 1;
    currentRightIndexPos = currentRightIndexPos + 2;
    render();
  }, tempo);
}

function flipLeft() {
  if (currentLeftIndexPos <= 0) return;
  leftPage.classList.add('flip-left');
  leftPage.style.zIndex = 100;
  setTimeout(() => {
    currentRightIndexPos = currentLeftIndexPos - 1;
    currentLeftIndexPos = currentLeftIndexPos - 2;
    render();
  }, tempo);
}

function gotoPage(targetPageIndex) {
  let idx = pagesIndexes.indexOf(targetPageIndex);
  if (idx === -1) return;
  
  if (idx % 2 === 1) {
    if (currentRightIndexPos === idx) return;
    rightPage.classList.add('flip-right');
    rightPage.style.zIndex = 100;
    setTimeout(() => {
      currentLeftIndexPos = idx - 1;
      currentRightIndexPos = idx;
      render();
    }, tempo);
  } else {
    if (currentLeftIndexPos === idx) return;
    leftPage.classList.add('flip-left');
    leftPage.style.zIndex = 100;
    setTimeout(() => {
      currentLeftIndexPos = idx;
      currentRightIndexPos = idx + 1;
      render();
    }, tempo);
  }
}

document.getElementById('nav-right').addEventListener('click', flipRight);
document.getElementById('nav-left').addEventListener('click', flipLeft);

document.addEventListener('click', function(e) {
  if (e.target.classList.contains('continue')) {
    flipRight();
  }
});

// Image overlay
document.addEventListener('click', function(e) {
  if (e.target.closest('.img-overlay')) return;
  const img = e.target.closest('img');
  if (!img) return;
  const link = img.closest('a');
  if (link) e.preventDefault();
  openImageOverlay(img);
});

function createOverlay() {
  const ov = document.createElement('div');
  ov.className = 'img-overlay';
  ov.innerHTML = '<div class="img-wrap"><img alt=""></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', closeOverlay);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeOverlay();
  });
  return ov;
}

let overlay = null;
function ensureOverlay() {
  if (!overlay) overlay = createOverlay();
  return overlay;
}

function openImageOverlay(sourceImg) {
  const ov = ensureOverlay();
  const clonedImg = ov.querySelector('img');
  clonedImg.src = sourceImg.currentSrc || sourceImg.src;
  clonedImg.alt = sourceImg.alt || '';
  ov.classList.add('open');
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
}

function closeOverlay() {
  if (!overlay) return;
  overlay.classList.remove('open');
  setTimeout(() => {
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }, 200);
}

render();
</script>
